<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 640" width="1300" height="640" role="img" aria-label="The eight T2I-CompBench++ sub-categories and the scorer for each, with colour and shape highlighted" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
