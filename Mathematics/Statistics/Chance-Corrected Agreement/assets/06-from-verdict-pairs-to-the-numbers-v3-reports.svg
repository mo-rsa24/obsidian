<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Integration: from verdict pairs to the numbers the v3 judge validation reports">
<title>Integration: from verdict pairs to the numbers the v3 judge validation reports</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f2937"/></marker></defs>
<rect width="1100" height="640" fill="#ffffff"/>
<text x="40.0" y="46.0" font-size="26" fill="#1f2937" text-anchor="start" font-weight="700">06  From verdict pairs to the numbers v3 reports</text>
<text x="40.0" y="74.0" font-size="14" fill="#6b7280" text-anchor="start" font-weight="400">Each box names the picture that teaches it and the way it goes wrong. Green boxes build on textbook 10.3; blue boxes are new here.</text>
<rect x="40.0" y="100.0" width="220.0" height="120.0" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2" opacity="1"/>
<text x="52.0" y="126.0" font-size="15.5" fill="#1f2937" text-anchor="start" font-weight="700">The v3 judge validation</text>
<text x="52.0" y="150.0" font-size="13" fill="#1f2937" text-anchor="start" font-weight="400">8 approved gold pages</text>
<text x="52.0" y="167.6" font-size="13" fill="#1f2937" text-anchor="start" font-weight="400">plus planted defects.</text>
<text x="52.0" y="185.1" font-size="13" fill="#1f2937" text-anchor="start" font-weight="400">One pass or fail from a</text>
<text x="52.0" y="202.7" font-size="13" fill="#1f2937" text-anchor="start" font-weight="400">person, one from the judge.</text>
<rect x="300.0" y="100.0" width="220.0" height="160.0" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="2" opacity="1"/>
<text x="312.0" y="124.0" font-size="15.5" fill="#1f2937" text-anchor="start" font-weight="700">01  The 2×2 and p<tspan baseline-shift="sub" font-size="70%">o</tspan></text>
<text x="312.0" y="148.0" font-size="13" fill="#1f2937" text-anchor="start" font-weight="400">cells + diagonal share</text>
<text x="312.0" y="165.6" font-size="13" fill="#1f2937" text-anchor="start" font-weight="400">p<tspan baseline-shift="sub" font-size="70%">o</tspan> = (TP + TN) / N</text>
<rect x="308.0" y="208.0" width="204.0" height="44.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1" opacity="1"/>
<text x="316.0" y="224.0" font-size="12" fill="#dc2626" text-anchor="start" font-weight="400">Fails: nearly all yes,</text>
<text x="316.0" y="239.0" font-size="12" fill="#dc2626" text-anchor="start" font-weight="400">so p<tspan baseline-shift="sub" font-size="70%">o</tspan> looks fine.</text>
<rect x="560.0" y="100.0" width="240.0" height="160.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2" opacity="1"/>
<text x="572.0" y="124.0" font-size="15.5" fill="#1f2937" text-anchor="start" font-weight="700">02  p<tspan baseline-shift="sub" font-size="70%">e</tspan> from the yes-rates</text>
<text x="572.0" y="148.0" font-size="13" fill="#1f2937" text-anchor="start" font-weight="400">h = person yes-rate</text>
<text x="572.0" y="165.6" font-size="13" fill="#1f2937" text-anchor="start" font-weight="400">j = judge yes-rate</text>
<text x="572.0" y="183.1" font-size="13" fill="#1f2937" text-anchor="start" font-weight="400">p<tspan baseline-shift="sub" font-size="70%">e</tspan> = hj + (1−h)(1−j)</text>
<rect x="568.0" y="208.0" width="224.0" height="44.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1" opacity="1"/>
<text x="576.0" y="224.0" font-size="12" fill="#dc2626" text-anchor="start" font-weight="400">Fails: h and j near 1,</text>
<text x="576.0" y="239.0" font-size="12" fill="#dc2626" text-anchor="start" font-weight="400">p<tspan baseline-shift="sub" font-size="70%">e</tspan> goes to 1.</text>
<rect x="40.0" y="330.0" width="240.0" height="180.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2" opacity="1"/>
<text x="52.0" y="354.0" font-size="15.5" fill="#1f2937" text-anchor="start" font-weight="700">03  Scott or Cohen?</text>
<text x="52.0" y="378.0" font-size="13" fill="#1f2937" text-anchor="start" font-weight="400">Scott: pooled rate for both</text>
<text x="52.0" y="395.6" font-size="13" fill="#1f2937" text-anchor="start" font-weight="400">Cohen: each rater&#x27;s own</text>
<text x="52.0" y="413.1" font-size="13" fill="#1f2937" text-anchor="start" font-weight="400">equal rates: same number</text>
<rect x="48.0" y="458.0" width="224.0" height="44.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1" opacity="1"/>
<text x="56.0" y="474.0" font-size="12" fill="#dc2626" text-anchor="start" font-weight="400">Fails: Cohen rewards</text>
<text x="56.0" y="489.0" font-size="12" fill="#dc2626" text-anchor="start" font-weight="400">a rate gap (p<tspan baseline-shift="sub" font-size="70%">e</tspan> shrinks).</text>
<rect x="320.0" y="330.0" width="240.0" height="180.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2" opacity="1"/>
<text x="332.0" y="354.0" font-size="15.5" fill="#1f2937" text-anchor="start" font-weight="700">04  κ = q × φ</text>
<text x="332.0" y="378.0" font-size="13" fill="#1f2937" text-anchor="start" font-weight="400">φ: ordering agreement</text>
<text x="332.0" y="395.6" font-size="13" fill="#1f2937" text-anchor="start" font-weight="400">q: rate-mismatch factor</text>
<text x="332.0" y="413.1" font-size="13" fill="#1f2937" text-anchor="start" font-weight="400">report both rates too</text>
<rect x="328.0" y="458.0" width="224.0" height="44.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1" opacity="1"/>
<text x="336.0" y="474.0" font-size="12" fill="#dc2626" text-anchor="start" font-weight="400">Fails: low κ read as a</text>
<text x="336.0" y="489.0" font-size="12" fill="#dc2626" text-anchor="start" font-weight="400">bad ranking, not a rate gap.</text>
<rect x="600.0" y="330.0" width="260.0" height="180.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2" opacity="1"/>
<text x="612.0" y="354.0" font-size="15.5" fill="#1f2937" text-anchor="start" font-weight="700">05  The kappa paradox</text>
<text x="612.0" y="378.0" font-size="13" fill="#1f2937" text-anchor="start" font-weight="400">κ falls toward 0 as the</text>
<text x="612.0" y="395.6" font-size="13" fill="#1f2937" text-anchor="start" font-weight="400">shared yes-rate nears 1</text>
<text x="612.0" y="413.1" font-size="13" fill="#1f2937" text-anchor="start" font-weight="400">while p<tspan baseline-shift="sub" font-size="70%">o</tspan> stays high</text>
<rect x="608.0" y="458.0" width="244.0" height="44.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1" opacity="1"/>
<text x="616.0" y="474.0" font-size="12" fill="#dc2626" text-anchor="start" font-weight="400">Fails: reading a low κ</text>
<text x="616.0" y="489.0" font-size="12" fill="#dc2626" text-anchor="start" font-weight="400">as a bad judge.</text>
<rect x="890.0" y="100.0" width="170.0" height="410.0" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="2" opacity="1"/>
<text x="902.0" y="126.0" font-size="15.5" fill="#059669" text-anchor="start" font-weight="700">What v3 reports</text>
<text x="902.0" y="154.0" font-size="13.5" fill="#1f2937" text-anchor="start" font-weight="400">p<tspan baseline-shift="sub" font-size="70%">o</tspan></text>
<text x="902.0" y="174.9" font-size="13.5" fill="#1f2937" text-anchor="start" font-weight="400">both yes-rates</text>
<text x="902.0" y="195.8" font-size="13.5" fill="#1f2937" text-anchor="start" font-weight="400">the 2×2 cells</text>
<text x="902.0" y="216.8" font-size="13.5" fill="#1f2937" text-anchor="start" font-weight="400">κ or π (named)</text>
<text x="902.0" y="237.7" font-size="13.5" fill="#1f2937" text-anchor="start" font-weight="400">φ and q</text>
<text x="902.0" y="258.6" font-size="13.5" fill="#1f2937" text-anchor="start" font-weight="400">wrong-pass share</text>
<text x="902.0" y="279.6" font-size="13.5" fill="#1f2937" text-anchor="start" font-weight="400">(Jung: the error</text>
<text x="902.0" y="300.5" font-size="13.5" fill="#1f2937" text-anchor="start" font-weight="400">that publishes)</text>
<line x1="260.0" y1="160.0" x2="300.0" y2="160.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ar)"/>
<line x1="520.0" y1="180.0" x2="560.0" y2="180.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ar)"/>
<line x1="680.0" y1="260.0" x2="680.0" y2="330.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ar)"/>
<line x1="800.0" y1="180.0" x2="890.0" y2="180.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ar)"/>
<line x1="400.0" y1="260.0" x2="400.0" y2="330.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ar)"/>
<line x1="280.0" y1="420.0" x2="320.0" y2="420.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ar)"/>
<line x1="560.0" y1="420.0" x2="600.0" y2="420.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ar)"/>
<line x1="860.0" y1="420.0" x2="890.0" y2="420.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="40.0" y="540.0" width="1020.0" height="52.0" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" opacity="1"/>
<text x="54.0" y="562.0" font-size="13" fill="#6b7280" text-anchor="start" font-weight="400">Not drawn here, listed as further gaps and not started: selective evaluation (Jung et al. 2407.18370), how sure a number is from few labels, abstention and coverage.</text>
<text x="54.0" y="582.0" font-size="13" fill="#6b7280" text-anchor="start" font-weight="400">Chapter 10.3 of the prototype textbook already teaches p<tspan baseline-shift="sub" font-size="70%">o</tspan>, p<tspan baseline-shift="sub" font-size="70%">e</tspan> and Cohen&#x27;s κ on ten pairs, so box 01 is a bridge and not a lesson.</text>
<text x="40.0" y="622.0" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400">Integration picture. Hours per node are on pictures 01 to 05 and summed in the gate file.</text>
</svg>
