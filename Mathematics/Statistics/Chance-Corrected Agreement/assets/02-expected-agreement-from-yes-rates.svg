<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Expected agreement p_e from the two yes-rates">
<title>Expected agreement p_e from the two yes-rates</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f2937"/></marker></defs>
<rect width="1100" height="640" fill="#ffffff"/>
<text x="40.0" y="46.0" font-size="26" fill="#1f2937" text-anchor="start" font-weight="700">02  Expected agreement, built from the yes-rates</text>
<rect x="40.0" y="61.0" width="150.0" height="22.0" rx="11" fill="#d1fae5" stroke="#059669" stroke-width="1.2" opacity="1"/>
<text x="115.0" y="76.0" font-size="13" fill="#059669" text-anchor="middle" font-weight="600">maths + mechanism</text>
<text x="205.0" y="76.0" font-size="13" fill="#6b7280" text-anchor="start" font-weight="400">1 drip ≈ 45 min · 1 scene ≈ 30 min · 1 segment ≈ 20 min</text>
<rect x="40.0" y="92.0" width="1020.0" height="34.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2" opacity="1"/>
<text x="54.0" y="114.0" font-size="15" fill="#dc2626" text-anchor="start" font-weight="600">Fails when: both yes-rates near 1: the shaded area covers almost the whole square and p<tspan baseline-shift="sub" font-size="70%">e</tspan> goes to 1.</text>
<rect x="250.0" y="190.0" width="320.0" height="320.0" rx="0" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5" opacity="1"/>
<rect x="250.0" y="190.0" width="272.0" height="288.0" rx="0" fill="#059669" stroke="none" stroke-width="1.5" opacity="0.55"/>
<rect x="522.0" y="478.0" width="48.0" height="32.0" rx="0" fill="#059669" stroke="none" stroke-width="1.5" opacity="0.55"/>
<rect x="250.0" y="190.0" width="320.0" height="320.0" rx="0" fill="none" stroke="#1f2937" stroke-width="1.8" opacity="1"/>
<line x1="522.0" y1="190.0" x2="522.0" y2="510.0" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 4"/>
<line x1="250.0" y1="478.0" x2="570.0" y2="478.0" stroke="#d97706" stroke-width="2" stroke-dasharray="5 4"/>
<text x="386.0" y="178.0" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="600">person yes 0.85</text>
<text x="546.0" y="178.0" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="600">no 0.15</text>
<text x="240.0" y="338.0" font-size="13" fill="#d97706" text-anchor="end" font-weight="600">judge yes 0.90</text>
<text x="240.0" y="498.0" font-size="13" fill="#d97706" text-anchor="end" font-weight="600">no 0.10</text>
<text x="410.0" y="548.0" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="400">area of the square = every possible pair of verdicts</text>
<text x="410.0" y="568.0" font-size="13" fill="#059669" text-anchor="middle" font-weight="600">green = both say yes, or both say no</text>
<rect x="640.0" y="170.0" width="420.0" height="170.0" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5" opacity="1"/>
<text x="660.0" y="200.0" font-size="16" fill="#1f2937" text-anchor="start" font-weight="700">Agreement two raters would reach</text>
<text x="660.0" y="224.0" font-size="16" fill="#1f2937" text-anchor="start" font-weight="700">if each answered at their own yes-rate,</text>
<text x="660.0" y="248.0" font-size="16" fill="#1f2937" text-anchor="start" font-weight="700">independently of the other:</text>
<text x="660.0" y="282.0" font-size="17" fill="#1f2937" text-anchor="start" font-weight="400">p<tspan baseline-shift="sub" font-size="70%">e</tspan> = 0.85 × 0.90  +  0.15 × 0.10</text>
<text x="660.0" y="304.9" font-size="17" fill="#1f2937" text-anchor="start" font-weight="400">    = 0.765  +  0.015   =  0.780</text>
<rect x="640.0" y="360.0" width="420.0" height="150.0" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5" opacity="1"/>
<text x="660.0" y="390.0" font-size="15" fill="#059669" text-anchor="start" font-weight="700">Of the 0.22 left above chance, the raters</text>
<text x="660.0" y="410.0" font-size="15" fill="#059669" text-anchor="start" font-weight="700">earned 0.07.</text>
<text x="660.0" y="440.0" font-size="14.5" fill="#1f2937" text-anchor="start" font-weight="400">Rescaled: (0.85 − 0.78) / (1 − 0.78) = 0.318</text>
<text x="660.0" y="459.6" font-size="14.5" fill="#1f2937" text-anchor="start" font-weight="400">This is Cohen&#x27;s κ, taught on ten pairs in textbook 10.3.</text>
<text x="40.0" y="596.0" font-size="14" fill="#6b7280" text-anchor="start" font-weight="400">p<tspan baseline-shift="sub" font-size="70%">e</tspan> is a function of the two yes-rates and nothing else. Change the rates and p<tspan baseline-shift="sub" font-size="70%">e</tspan> moves while the table&#x27;s diagonal stays put.</text>
<text x="40.0" y="622.0" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400">Numbers computed from the 20-product toy (person yes 17/20, judge yes 18/20). Rao and Callison-Burch 2606.00093 §4.2 gives p<tspan baseline-shift="sub" font-size="70%">e</tspan> = π π̂ + (1−π)(1−π̂).</text>
</svg>
