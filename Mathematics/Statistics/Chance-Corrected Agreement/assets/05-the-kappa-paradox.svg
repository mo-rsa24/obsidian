<text x="768.0" y="244.2" font-size="13.5" fill="#6b7280" text-anchor="start" font-weight="400">yes-rate 0.50:  p<tspan baseline-shift="sub" font-size="70%">e</tspan> 0.500   κ +0.800</text>
<text x="768.0" y="262.4" font-size="13.5" fill="#6b7280" text-anchor="start" font-weight="400">yes-rate 0.80:  p<tspan baseline-shift="sub" font-size="70%">e</tspan> 0.680   κ +0.687</text>
