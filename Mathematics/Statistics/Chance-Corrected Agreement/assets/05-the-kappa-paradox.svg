<rect x="750.0" y="375.0" width="310.0" height="155.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" opacity="1"/>
<text x="768.0" y="403.0" font-size="14.5" fill="#dc2626" text-anchor="start" font-weight="700">The v3 judge sits at the right edge</text>
<text x="768.0" y="428.0" font-size="13.5" fill="#1f2937" text-anchor="start" font-weight="400">Nearly every gold page passes, so the</text>
<text x="768.0" y="446.2" font-size="13.5" fill="#1f2937" text-anchor="start" font-weight="400">shared yes-rate is high. Its actual rates</text>
<text x="768.0" y="464.4" font-size="13.5" fill="#1f2937" text-anchor="start" font-weight="400">are not measured yet: that is a task,</text>
<text x="768.0" y="482.7" font-size="13.5" fill="#1f2937" text-anchor="start" font-weight="400">not a number on this picture.</text>
<text x="40.0" y="588.0" font-size="13" fill="#6b7280" text-anchor="start" font-weight="400">Where the curve ends: with equal rates r, p<tspan baseline-shift="sub" font-size="70%">o</tspan> cannot fall below 1 − 2(1 − r), so each curve stops at r = 1 − (1 − p<tspan baseline-shift="sub" font-size="70%">o</tspan>)/2.</text>
<text x="40.0" y="606.0" font-size="13" fill="#6b7280" text-anchor="start" font-weight="400">Rao and Callison-Burch 2606.00093 §4.2: κ = 2 p<tspan baseline-shift="sub" font-size="70%">o</tspan> − 1 when the rates are 0.5, and p<tspan baseline-shift="sub" font-size="70%">e</tspan> → 1 for a criterion nearly all items meet (Feinstein and Cicchetti 1990).</text>
<text x="40.0" y="622.0" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400">Curves fix p<tspan baseline-shift="sub" font-size="70%">o</tspan> and vary the shared yes-rate r (p<tspan baseline-shift="sub" font-size="70%">e</tspan> = r² + (1−r)²). Open dots: Scott&#x27;s π of judges A to D at each pooled yes-rate.</text>
</svg>
