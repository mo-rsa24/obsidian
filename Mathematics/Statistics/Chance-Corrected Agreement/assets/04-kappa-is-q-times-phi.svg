<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="kappa equals q times phi">
<title>kappa equals q times phi</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f2937"/></marker></defs>
<rect width="1100" height="640" fill="#ffffff"/>
<text x="40.0" y="46.0" font-size="26" fill="#1f2937" text-anchor="start" font-weight="700">04  κ = q × φ: the rate-mismatch factor</text>
<rect x="40.0" y="61.0" width="150.0" height="22.0" rx="11" fill="#d1fae5" stroke="#059669" stroke-width="1.2" opacity="1"/>
<text x="115.0" y="76.0" font-size="13" fill="#059669" text-anchor="middle" font-weight="600">maths + mechanism</text>
<text x="205.0" y="76.0" font-size="13" fill="#6b7280" text-anchor="start" font-weight="400">1 drip ≈ 45 min · 1 scene ≈ 30 min · 1 segment ≈ 20 min</text>
<rect x="40.0" y="92.0" width="1020.0" height="34.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2" opacity="1"/>
<text x="54.0" y="114.0" font-size="15" fill="#dc2626" text-anchor="start" font-weight="600">Fails when: q is below 1 whenever the two yes-rates differ, so κ is always smaller than φ, even for a judge that orders products well.</text>
<text x="50.0" y="186.0" font-size="16" fill="#1f2937" text-anchor="start" font-weight="700">Judge A (rates 0.85, 0.90)</text>
<rect x="50.0" y="210.0" width="196.0" height="26.0" rx="0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" opacity="1"/>
<text x="58.0" y="229.0" font-size="14" fill="#2563eb" text-anchor="start" font-weight="700">φ = 0.327</text>
<text x="50.0" y="266.0" font-size="15" fill="#6b7280" text-anchor="start" font-weight="600">× q = 0.974</text>
<rect x="50.0" y="282.0" width="190.9" height="26.0" rx="0" fill="#d1fae5" stroke="#059669" stroke-width="1.5" opacity="1"/>
<text x="58.0" y="301.0" font-size="14" fill="#059669" text-anchor="start" font-weight="700">κ = 0.318</text>
<text x="50.0" y="334.0" font-size="13" fill="#6b7280" text-anchor="start" font-weight="400">person 0.85, judge 0.90</text>
<text x="50.0" y="366.0" font-size="16" fill="#1f2937" text-anchor="start" font-weight="700">Judge D, strict (rates 0.85, 0.70)</text>
<rect x="50.0" y="390.0" width="385.0" height="26.0" rx="0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" opacity="1"/>
<text x="58.0" y="409.0" font-size="14" fill="#2563eb" text-anchor="start" font-weight="700">φ = 0.642</text>
<text x="50.0" y="446.0" font-size="15" fill="#6b7280" text-anchor="start" font-weight="600">× q = 0.909</text>
<rect x="50.0" y="462.0" width="350.0" height="26.0" rx="0" fill="#d1fae5" stroke="#059669" stroke-width="1.5" opacity="1"/>
<text x="58.0" y="481.0" font-size="14" fill="#059669" text-anchor="start" font-weight="700">κ = 0.583</text>
<text x="50.0" y="514.0" font-size="13" fill="#6b7280" text-anchor="start" font-weight="400">person 0.85, judge 0.70</text>
<text x="50.0" y="574.0" font-size="14" fill="#dc2626" text-anchor="start" font-weight="600">Judge D loses 9% of its φ to q, judge A 3%.</text>
<text x="50.0" y="596.0" font-size="14" fill="#dc2626" text-anchor="start" font-weight="600">Judge C passes everything: φ is undefined and q = 0.</text>
