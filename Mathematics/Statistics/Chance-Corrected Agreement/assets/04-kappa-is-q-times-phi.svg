<text x="530.0" y="178.0" font-size="14" fill="#1f2937" text-anchor="start" font-weight="700">q depends on the two yes-rates only</text>
<text x="530.0" y="556.0" font-size="14" fill="#1f2937" text-anchor="start" font-weight="400">q = 1 exactly when the yes-rates are equal. Otherwise 0 &lt; q &lt; 1.</text>
<text x="530.0" y="576.0" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400">Rao and Callison-Burch 2606.00093 Eq. (8), after Sahu and Demirtas 2024.</text>
<text x="40.0" y="622.0" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400">φ = (TP·TN − FP·FN) / √((TP+FP)(TP+FN)(TN+FP)(TN+FN)). q = 2√(AB)/(A+B), A = π(1−π̂), B = π̂(1−π). Judges A to D of the worked example; κ = q·φ asserted to 1e-12.</text>
</svg>
